name: collect

on:
  schedule:
    # Cron is UTC. 03:35-21:35 UTC covers 06:35-23:35 Chisinau in summer (UTC+3)
    # and 05:35-22:35 in winter (UTC+2); the script itself skips runs that fall
    # outside the local 06:30-23:59 window, so DST needs no cron change.
    - cron: "35 3-21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print rows: no CSV write, no Sheets push"
        type: boolean
        default: true
      ignore_window:
        description: "Run even outside the 06:30-23:59 Chisinau window"
        type: boolean
        default: true
      commit_html:
        description: "Commit the fetched pages into fixtures/real/ (for parser tests)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - run: python -m playwright install --with-deps chromium

      - name: Collect
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          ARGS="--save-html run-html"
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.ignore_window }}" != "true" ]; then
            ARGS="$ARGS --respect-window"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "python -m collector.run $ARGS"
          python -m collector.run $ARGS

      - name: Upload fetched pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetched-html-${{ github.run_id }}
          path: run-html
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit raw data
        if: always()
        run: |
          if [ "${{ inputs.commit_html }}" = "true" ] && [ -d run-html ]; then
            mkdir -p fixtures/real
            cp -r run-html/. fixtures/real/
            git add fixtures/real
          fi
          git add data/raw
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
