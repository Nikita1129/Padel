# Clubs tracked by the collector. Adding a club = adding one entry here.
#
# slug            short id used in file names and logs
# name            value written in the `club` column (kept identical to the legacy data)
# url             Courtica booking grid; the day is selected with &date=YYYY-MM-DD
# expected_courts the run fails if the grid shows a different number of courts
# slot_minutes    the run fails if the grid step differs
# fetch           auto  = try a plain HTML GET first, fall back to a headless browser
#                 html  = plain GET only (fail if the grid is not in the HTML)
#                 browser = headless Chromium only
# price_per_hour  MDL per court-hour used ONLY for revenue_estimate_mdl in daily_occupancy.
#                 The sites do not expose prices; these are assumptions carried over from the
#                 legacy actor. Replace with real list prices when known.
# platform        courtica (default) or padelpoint (padelpoint.md booking page,
#                 always a browser: courts are opened by clicking on a map)
timezone: Europe/Chisinau
# Whole-run time budget. Courtica clubs take ~1 s per page; PadelPoint needs a
# browser and ~9 court clicks per day, so it alone can take 1-2 minutes.
run_budget_seconds: 240
# Google Sheet that receives the derived tabs (the long id from its URL, between /d/ and /edit).
# Credentials never live here: the service-account JSON comes from the env var GOOGLE_SERVICE_ACCOUNT_JSON.
sheet_id: "12ERstCiyaaJVNjnK2pgmnHo5VcDFtsVnmN2DNq5g9VM"
# Scheduled runs outside this local-time window exit 0 without doing anything
# (cron is UTC; the workflow schedules a wide UTC range and lets this decide).
collection_window: "06:30-23:59"
clubs:
  - slug: divi-padel
    name: Divi Padel Club
    url: https://www.courtica.md/en-MD/clubs/divi-padel?sport=padel
    expected_courts: 4
    slot_minutes: 60
    fetch: auto
    price_per_hour: 500
  - slug: ursu-padel
    name: Ursu Padel
    url: https://www.courtica.md/en-MD/clubs/ursu-padel?sport=padel
    expected_courts: 1
    slot_minutes: 30
    fetch: auto
    price_per_hour: 250
  - slug: primus-padel-costesti
    name: Primus Padel Costesti
    url: https://www.courtica.md/en-MD/clubs/primus-padel-costesti?sport=padel
    expected_courts: 2
    slot_minutes: 30
    fetch: auto
    price_per_hour: 300
  - slug: padelpoint
    name: PadelPoint
    platform: padelpoint
    url: https://padelpoint.md/booking/ro/
    expected_courts: 9
    slot_minutes: 30
    fetch: browser
    price_per_hour: 500
